<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />
  
  <!-- Scale & Balance Icon Graphic -->
  <g filter="url(#glow)">
    <!-- Central Pillar -->
    <rect x="246" y="130" width="20" height="230" rx="10" fill="#ffffff" />
    <!-- Pedestal Base -->
    <path d="M180 360 L332 360 L346 390 L166 390 Z" fill="#e0e7ff" />
    <rect x="150" y="390" width="212" height="24" rx="12" fill="#ffffff" />
    
    <!-- Top Fulcrum / Balance Pivot -->
    <circle cx="256" cy="140" r="22" fill="#ffffff" />
    <circle cx="256" cy="140" r="10" fill="#4f46e5" />
    
    <!-- Crossbar Beam (Dynamic Tilted Balance) -->
    <g transform="rotate(-6 256 140)">
      <rect x="110" y="134" width="292" height="12" rx="6" fill="#ffffff" />
      
      <!-- Left Pan (Higher) -->
      <line x1="130" y1="140" x2="90" y2="240" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" />
      <line x1="130" y1="140" x2="170" y2="240" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" />
      <path d="M74 240 C74 274 186 274 186 240 Z" fill="url(#accentGrad)" />
      
      <!-- Right Pan (Lower - Winning Option) -->
      <line x1="382" y1="140" x2="342" y2="260" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" />
      <line x1="382" y1="140" x2="422" y2="260" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" />
      <path d="M326 260 C326 294 438 294 438 260 Z" fill="#ffffff" />
      
      <!-- Sparkle/Star on Winning Side -->
      <path d="M382 220 L386 232 L398 236 L386 240 L382 252 L378 240 L366 236 L378 232 Z" fill="#fbbf24" />
    </g>
    
    <!-- Sparkles on Top Left -->
    <path d="M120 90 L124 100 L134 104 L124 108 L120 118 L116 108 L106 104 L116 100 Z" fill="#a5b4fc" />
    <path d="M390 80 L393 88 L401 91 L393 94 L390 102 L387 94 L379 91 L387 88 Z" fill="#c7d2fe" />
  </g>
</svg>
